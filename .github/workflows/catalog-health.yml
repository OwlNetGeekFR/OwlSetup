name: Santé du catalogue

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - app.js
      - assets/logos/**
      - tools/check-catalog.mjs
      - .github/workflows/catalog-health.yml
  pull_request:
    paths:
      - app.js
      - assets/logos/**
      - tools/check-catalog.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier les identifiants, sites et logos
        run: node tools/check-catalog.mjs
